services:
  - type: web
    name: chatboost-ai
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_BUSINESS_NAME
        value: ChatBoost AI
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
