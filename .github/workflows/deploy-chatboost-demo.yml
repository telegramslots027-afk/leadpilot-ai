name: Deploy ChatBoost AI demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "public/demo/**"
      - ".github/workflows/deploy-chatboost-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages and enable the site
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload demo site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public/demo
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
